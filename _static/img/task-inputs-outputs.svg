<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="task-io-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
  </defs>

  <!-- card background so the diagram reads on both light and dark pages -->
  <rect x="0" y="0" width="560" height="280" rx="6" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="20" y="40" width="150" height="200" rx="14" fill="#19d531"/>
  <text x="95" y="90" text-anchor="middle" font-size="23" font-weight="bold" fill="#000000">Inputs</text>
  <text x="95" y="128" text-anchor="middle" font-size="18" fill="#000000">Parameters</text>
  <text x="95" y="164" text-anchor="middle" font-size="18" fill="#000000">Resources</text>
  <text x="95" y="200" text-anchor="middle" font-size="18" fill="#000000">Files</text>

  <line x1="180" y1="124" x2="234" y2="124" stroke="#222222" stroke-width="3" marker-end="url(#task-io-arrow)"/>
  <line x1="180" y1="160" x2="220" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#task-io-arrow)"/>
  <line x1="180" y1="196" x2="234" y2="196" stroke="#222222" stroke-width="3" marker-end="url(#task-io-arrow)"/>

  <!-- Task -->
  <circle cx="280" cy="160" r="52" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="280" y="169" text-anchor="middle" font-size="25" font-weight="bold" fill="#000000">Task</text>

  <line x1="324" y1="124" x2="382" y2="124" stroke="#222222" stroke-width="3" marker-end="url(#task-io-arrow)"/>
  <line x1="339" y1="160" x2="382" y2="160" stroke="#222222" stroke-width="3" marker-end="url(#task-io-arrow)"/>
  <line x1="324" y1="196" x2="382" y2="196" stroke="#222222" stroke-width="3" marker-end="url(#task-io-arrow)"/>

  <!-- Outputs -->
  <rect x="390" y="40" width="150" height="200" rx="14" fill="#ff3535"/>
  <text x="465" y="90" text-anchor="middle" font-size="23" font-weight="bold" fill="#000000">Outputs</text>
  <text x="465" y="128" text-anchor="middle" font-size="18" fill="#000000">Parameters</text>
  <text x="465" y="164" text-anchor="middle" font-size="18" fill="#000000">Resources</text>
  <text x="465" y="200" text-anchor="middle" font-size="18" fill="#000000">Files</text>
</svg>
