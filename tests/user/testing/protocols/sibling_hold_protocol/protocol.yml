type: sibling_hold_protocol
desc: a holds D2 for c, while b (a sibling that c depends on) also needs D2
labs: [abstract_lab]
tasks:
  - name: a
    type: Noop Hold
    duration: 10
    devices:
      held_device: {lab_name: abstract_lab, name: D2, hold: true}
  - name: b
    type: Noop Hold
    duration: 10
    devices:
      held_device: {lab_name: abstract_lab, name: D2}
  - name: c
    type: Noop Hold
    duration: 10
    dependencies: [a, b]
    devices:
      held_device: {ref: a.held_device}
