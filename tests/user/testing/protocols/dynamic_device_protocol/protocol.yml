type: dynamic_device_protocol
desc: ProtocolRun to test dynamic device allocation

labs:
  - dynamic_lab

tasks:
  - name: A
    type: Noop DT3
    devices:
      device_1:
        allocation_type: dynamic
        device_type: DT3
        allowed_labs: [dynamic_lab]

  - name: B
    type: Noop DT2
    dependencies: ["A"]
    devices:
      device_1:
        allocation_type: dynamic
        device_type: DT2
        allowed_labs: [dynamic_lab]

  - name: C
    type: Noop DT3
    dependencies: ["A"]
    devices:
      device_1:
        allocation_type: dynamic
        device_type: DT3
        allowed_labs: [dynamic_lab]
        allowed_devices:
          - lab_name: dynamic_lab
            name: DX3B

  - name: D
    type: Noop DT5
    dependencies: ["B", "C"]
    devices:
      device_1:
        allocation_type: dynamic
        device_type: DT5
        allowed_labs: [dynamic_lab]

  - name: E
    type: Noop DT3
    dependencies: ["D"]
    devices:
      device_1: C.device_1

  - name: F
    type: Noop DT3
    dependencies: ["E"]
    devices:
      device_1: E.device_1

  - name: G
    type: Noop Analyze
    dependencies: ["D", "F"]
    devices:
      analyzer: A.device_1
      processor: D.device_1
